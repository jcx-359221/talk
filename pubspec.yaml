name: consent_chat
description: A consent-based private messaging starter app.
publish_to: none
version: 0.1.2+10

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^11.3.3
  file_picker: ^8.1.7
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^19.4.2
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  pinyin: ^3.3.0
  record: ^6.0.0
  uuid: ^4.5.1
  vibration: ^3.1.3
  wakelock_plus: ^1.3.3
  basic_utils: 5.8.2
  image_picker: ^1.2.4
  video_thumbnail: ^0.5.6
  image: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
